services:

  nginx:
    image: nginx:latest
    container_name: chargeflow_nginx
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - api
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chargeflow_api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    network_mode: host
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
    volumes:
      - /var/run/postgresql:/var/run/postgresql

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: chargeflow_frontend
    command: python -m frontend.main
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - api

  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    container_name: etl_run
    command: sleep infinity
    network_mode: host
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
    volumes:
      - /var/run/postgresql:/var/run/postgresql
