events {}

http {

    # 🔥 редирект HTTP → HTTPS
    server {
        listen 80;
        server_name dev.opower.su app.opower.su api.opower.su;
        return 301 https://$host$request_uri;
    }

    # ===== FRONT (dev + app) =====
    server {
        listen 443 ssl;
        server_name dev.opower.su app.opower.su;

        ssl_certificate /etc/letsencrypt/live/dev.opower.su/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dev.opower.su/privkey.pem;

        location / {
            proxy_pass http://127.0.0.1:8080;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API через /api
        location /api/ {
            proxy_pass http://127.0.0.1:8000/;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ===== API =====
    server {
        listen 443 ssl;
        server_name api.opower.su;

        ssl_certificate /etc/letsencrypt/live/dev.opower.su/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dev.opower.su/privkey.pem;

        location / {
            proxy_pass http://127.0.0.1:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}